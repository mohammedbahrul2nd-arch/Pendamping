<style>

.tag{display:inline-block;font-size:.72rem;color:var(--wa);border:1px solid var(--wa);border-radius:6px;padding:0 .35rem;margin-left:4px}
table{border-collapse:collapse;width:100%;font-size:.85rem}td,th{border-bottom:1px solid var(--line);padding:5px 4px;text-align:left}

:root{--acrgb:108,197,184}html[data-tema=terang]{--acrgb:42,138,126}
body{background:radial-gradient(1200px 500px at 50% -10%,rgba(var(--acrgb),.10),transparent 60%),var(--bg)}

#nav{backdrop-filter:blur(14px);background:color-mix(in srgb,var(--bg2) 85%,transparent)}

#nav button.on::before{content:"";position:absolute;top:0;width:28px;height:3px;border-radius:0 0 4px 4px;background:var(--ac)}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.chip{position:relative;overflow:hidden;transition:background .3s,border-color .3s,box-shadow .3s,transform .12s,color .3s}.chip:active{transform:scale(.94)}
.chip[data-h]:not(.on){background:rgba(var(--acrgb),calc(.05 + var(--h)*.05));border-color:rgba(var(--acrgb),calc(.3 + var(--h)*.11));box-shadow:0 0 calc(var(--h)*3px) rgba(var(--acrgb),calc(var(--h)*.1))}
.chip[data-h="4"]:not(.on),.chip[data-h="5"]:not(.on),.chip[data-h="6"]:not(.on){color:var(--ac);font-weight:600}
.chip[data-h="6"]:not(.on){border-color:var(--ac)}
.chip[data-p]:not(.on)::after{content:"";position:absolute;left:12px;bottom:2px;height:2px;border-radius:2px;width:calc(var(--p)*(100% - 24px));background:rgba(var(--acrgb),.85)}
.seg{display:flex;gap:6px;overflow-x:auto;padding:4px 0 8px;scrollbar-width:none;position:sticky;top:0;z-index:5;background:var(--bg)}.seg::-webkit-scrollbar{display:none}
.seg button{flex:none;background:var(--card);border:1px solid var(--line);color:var(--mu);border-radius:999px;padding:.45rem .9rem;font:inherit;font-size:.88rem;cursor:pointer}.seg button.on{background:var(--ac);color:#06201c;border-color:var(--ac);font-weight:700}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0}.tile{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px}.tile b{display:block;font-size:1.6rem;line-height:1.1;color:var(--ac)}.tile span{font-size:.8rem;color:var(--mu)}
.ins{border-left:3px solid var(--ac);padding:2px 0 2px 12px;margin:12px 0}.ins small{color:var(--wa);font-size:.72rem;letter-spacing:.04em;text-transform:uppercase}.ins p{margin:.15rem 0}
.dv{position:relative;height:10px;background:var(--line);border-radius:6px;margin:3px 0 9px}.dv i{position:absolute;top:0;height:100%;border-radius:6px}.dv:after{content:"";position:absolute;left:50%;top:-2px;bottom:-2px;width:1px;background:var(--mu)}

.dot{display:inline-block;width:.55em;height:.55em;border-radius:50%;background:var(--wa);margin-left:.4em;vertical-align:middle}
.kv{display:flex;justify-content:space-between;gap:12px;padding:.4rem 0;border-bottom:1px solid var(--line);font-size:.92rem}.kv:last-of-type{border-bottom:0}.kv span{color:var(--mu)}
.rel{margin:.3rem 0 0;padding-left:1.1rem}.rel li{margin:.2rem 0;font-size:.9rem}
.fl{display:flex;justify-content:space-between;gap:10px;font-size:.88rem;padding:.3rem 0}
button:disabled{opacity:.55}
.tp2{display:flex;justify-content:center;gap:14px;margin:6px 0}
.tp2 .tap{width:min(42vw,200px);height:min(42vw,200px);margin:8px 0}.tp2 .tap .t1{font-size:1.2rem;text-align:center;padding:0 8px}.tp2 .tap .t2{font-size:.9rem}
.tap.rl{background:radial-gradient(circle at 35% 30%,#e59a9a,#a85050);color:#2a0808;box-shadow:0 0 0 8px rgba(217,130,130,.10),0 14px 40px rgba(0,0,0,.3);animation:none}.tap.rl.lock{opacity:.45}

<script>
'use strict';
/* ================= util ================= */
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const uid=()=>'abcdefghijklmnopqrstuvwxyz'[Math.floor(Math.random()*26)]+Math.random().toString(36).slice(2,5).padEnd(3,'x');
function newId(list){let i;do{i=uid()}while(list.some(x=>x.id===i));return i}
const T=x=>new Date(x).getTime();
function isoTz(d){d=d||new Date();const o=-d.getTimezoneOffset(),s=o>=0?'+':'-',a=Math.abs(o);return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())+'T'+pad(d.getHours())+':'+pad(d.getMinutes())+':'+pad(d.getSeconds())+s+pad(Math.floor(a/60))+':'+pad(a%60)}
function dtLocal(x){const d=new Date(x);return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())+'T'+pad(d.getHours())+':'+pad(d.getMinutes())}
function tzName(){try{return Intl.DateTimeFormat().resolvedOptions().timeZone}catch(e){return ''}}
const med=a=>{a=a.filter(x=>x!==''&&x!=null&&!isNaN(x)).map(Number).sort((x,y)=>x-y);if(!a.length)return null;const m=a.length>>1;return a.length%2?a[m]:(a[m-1]+a[m])/2};
const r1=x=>Math.round(x*10)/10;
function fmtMs(ms){const s=Math.ceil(ms/1000);return pad(Math.floor(s/60))+':'+pad(s%60)}
function fmtT(iso){return iso?new Date(iso).toLocaleString('id-ID',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}):''}
const hm=iso=>{if(!iso)return'';const d=new Date(iso);return isNaN(d)?'':pad(d.getHours())+':'+pad(d.getMinutes())};
function fmtHM(iso){const d=new Date(iso);return pad(d.getHours())+':'+pad(d.getMinutes())}
function dayLabel(ds){return new Date(ds+'T12:00:00').toLocaleDateString('id-ID',{weekday:'short',day:'numeric',month:'short'})}

/* ================= data pilihan ================= */
const L=x=>x.split('|');
const OPT={
konteks:L('bosan|capek|stres|kesepian|cemas|sedih|marah|sendirian di kamar|sebelum tidur|habis lihat medsos|baru bangun tidur|tidak bisa tidur|tengah malam|sendirian di rumah|tidak ada kegiatan|menunda tugas atau pekerjaan|tekanan deadline|habis bertengkar|merasa ditolak atau kecewa|merasa gagal|merasa tidak berharga|iri atau membandingkan diri|rindu seseorang|scroll tanpa tujuan|habis lihat konten sensual|nonton film atau serial|akhir pekan atau libur|setelah mandi|di kamar mandi|ponsel di tangan|internet bebas tanpa batas|ingin menghadiahi diri|setelah hari yang berat|lapar|kurang tidur|sakit atau tidak enak badan|pikiran berulang|teringat kenangan|jauh dari keluarga atau pasangan|tekanan dari lingkungan|merasa tidak punya tujuan|setelah minum kopi atau kafein|menunggu lama|baru pulang bepergian|gelisah tanpa sebab jelas'),
kebutuhan:L('lapar|marah|kesepian|capek|ingin dihibur|ingin rileks|butuh istirahat|butuh tidur nyenyak|butuh kasih sayang|butuh diterima|butuh diperhatikan|butuh pelarian|butuh rasa kendali|butuh kesenangan|butuh rasa aman|butuh teman bicara|butuh sentuhan atau kedekatan|butuh bergerak|butuh makan atau minum|butuh mengalihkan pikiran|butuh melepas stres|butuh merasa mampu|butuh tantangan|butuh makna atau tujuan|butuh dihargai|butuh ruang sendiri|butuh menenangkan cemas|butuh melepas sedih|butuh melepas amarah|butuh kepastian'),
lokasi:L('kamar|ruang lain|di luar|kasur|kamar mandi|ruang tamu|ruang kerja atau belajar|dapur|kos atau asrama|rumah sendiri|rumah keluarga|rumah teman|kantor|kampus atau sekolah|kendaraan|hotel atau penginapan|tempat umum|toilet umum|balkon atau halaman|sofa'),
tubuh:L('dada|perut|bawah perut|kemaluan|anus atau area sekitarnya|selangkangan atau panggul|tenggorokan|wajah terasa panas|jantung berdebar|napas pendek|otot tegang|seluruh tubuh|gelisah ingin bergerak|tidak terasa di tubuh'),
ling:L('Bangkit dari tempat|Turun dari kasur|Pindah ke ruang tamu atau ruang bersama|Tinggalkan ponsel di ruangan lain|Taruh ponsel di luar kamar dan isi daya di sana|Letakkan ponsel menghadap bawah, jauh dari jangkauan|Keluar rumah sebentar|Buka pintu kamar lebar-lebar|Buka jendela atau pintu|Nyalakan lampu terang|Tutup laptop atau matikan layar|Aktifkan mode pesawat|Nyalakan pemblokir situs atau filter konten|Tutup semua tab dan aplikasi yang terbuka|Keluar dari akun medsos atau streaming|Matikan notifikasi untuk sementara|Serahkan perangkat ke orang serumah|Pindah ke tempat ramai|Duduk dekat orang lain|Cuci muka atau berwudu|Mandi|Ganti pakaian yang rapat dan nyaman|Pakai sepatu lalu keluar|Rapikan tempat tidur|Putar musik atau podcast|Minum segelas air|Berdiri dan peregangan|Pergi ke warung atau minimarket|Pindah ke teras atau halaman|Nyalakan musik dan lakukan pekerjaan rumah')};
const OLDDEF={tubuh:L('dada|perut|tangan|kepala|seluruh tubuh|tenggorokan|leher|bahu|punggung|rahang|wajah|mata|jantung berdebar|napas pendek|kaki|paha|bawah perut|telapak tangan|tidak terasa di tubuh|gelisah ingin bergerak|pantat'),ling:L('Bangkit dari tempat|Pindah ruangan|Tinggalkan ponsel di tempat lain|Keluar rumah sebentar|Duduk di ruang bersama|Buka jendela atau pintu|Nyalakan lampu terang|Tutup laptop atau matikan layar|Taruh ponsel di luar kamar|Aktifkan mode pesawat|Pindah ke tempat ramai|Cuci muka atau berwudu|Ganti pakaian|Rapikan meja atau tempat tidur|Nyalakan pemblokir situs|Putar musik atau podcast|Nyalakan TV di ruang tengah|Minum segelas air|Berdiri dan peregangan|Duduk menghadap pintu terbuka|Pindah ke teras atau halaman|Tinggalkan perangkat di ruangan lain')};
const ADD2={konteks:L('ruangan gelap atau sepi|notifikasi atau iklan memicu|setelah makan besar|merasa bersalah atau malu|melihat orang lain tampak bahagia'),kebutuhan:L('butuh jeda dari tugas|butuh rasa nyaman|butuh validasi atau pengakuan')};
const OPTL=[['konteks','Konteks'],['kebutuhan','Kebutuhan di baliknya'],['lokasi','Lokasi umum'],['tubuh','Di mana terasa'],['ling','Ubah lingkungan']];
const OPTD=()=>{const o={};for(const k in OPT)o[k]=[...OPT[k],...(ADD2[k]||[])];return o};
const OP=k=>S.opts[k];

function mdSteps(ep){const k=ep?ep.konteks:[];let s=['jeda','nama','ling','rencana','alt','kontak','tutup'];
 if(k.some(x=>/tidur|kamar|gelap|bangun|malam/.test(x)))s=['jeda','ling','nama','rencana','alt','kontak','tutup'];
 else if(k.some(x=>/stres|kesepian|cemas|sedih|capek|marah|tekanan|gagal|ditolak|kecewa|iri|rindu|bertengkar|berharga/.test(x)))s=['jeda','nama','kontak','alt','ling','rencana','tutup'];
 else if(k.includes('bosan'))s=['jeda','alt','nama','ling','rencana','kontak','tutup'];
 s=s.filter(x=>x!=='rencana');if(!S.settings.kontak_tepercaya)s=s.filter(x=>x!=='kontak');return s}
function openMD(epId){const ep=epId?S.episodes.find(e=>e.id===epId):null;MD={ep:ep?ep.id:null,i:0,t0:Date.now(),started:new Date(),steps:mdSteps(ep),used:[],ling:[],done:false};if(MD.iv)clearInterval(MD.iv);MD.iv=setInterval(mdTick,1000);renderMD()}
function mdTick(){if(!MD)return;const el=$('#mdt');if(!el)return;const left=Math.max(0,S.settings.jeda_menit*60000-(Date.now()-MD.t0));el.textContent=fmtMs(left);if(left===0){el.parentElement.classList.add('done');const m=$('#mdmsg');if(m)m.textContent='Jeda selesai. Kamu boleh lanjut atau tetap di sini.'}}
function addStrat(s){if(!MD.used.includes(s))MD.used.push(s);if(MD.ep){const e=S.episodes.find(x=>x.id===MD.ep);if(e&&!e.strategi.includes(s)){e.strategi.push(s);save()}}}
/* Bandit kontekstual: keberhasilan dibobot kecocokan konteks dan peluruhan waktu (paruh 60 hari),
   disusutkan ke laju global aktivitas itu, yang disusutkan lagi ke laju dasar semua episode (shrinkage hierarkis),
   ditambah bonus eksplorasi UCB dan bonus kecocokan pemicu. */
function rankedAlts(){const now=Date.now(),ep=MD&&MD.ep?S.episodes.find(e=>e.id===MD.ep):null,ks=ep?ep.konteks:[],closed=S.episodes.filter(e=>e.hasil),N=closed.length+1,base=closed.length?closed.filter(e=>e.hasil!=='diikuti').length/closed.length:.5;
 const acts=S.activities.filter(a=>a.jenis==='alternatif'&&a.aktif!=='tidak');
 return acts.map((a,i)=>{const s='aktivitas: '+a.nama,cl=closed.filter(e=>(e.strategi||[]).includes(s));let gw=0,gk=0,w=0,k=0;
  cl.forEach(e=>{const d=Math.pow(.5,(now-T(e.waktu_mulai))/(60*864e5)),ok=e.hasil!=='diikuti'?1:0,m=d*(1+2*(e.konteks||[]).filter(x=>ks.includes(x)).length);gw+=d;gk+=d*ok;w+=m;k+=m*ok});
  const n=cl.length,g=(gk+2*base)/(gw+2),mean=(k+2*g)/(w+2);
  return{a,i,n,ok:cl.filter(e=>e.hasil!=='diikuti').length,rate:n>=3?mean:-1,u:mean+.5*Math.sqrt(1.2*Math.log(N+1)/(n+1))+Math.min(.3,.15*(a.pemicu||[]).filter(x=>ks.includes(x)).length)}}).sort((x,y)=>y.u-x.u||x.i-y.i)}
function altSug(skip){const own=S.activities.filter(a=>a.aktif!=='tidak').map(a=>a.nama);const pool=[...(S.custom.alt||[]),...SARAN].filter((x,i,a)=>a.indexOf(x)===i&&!own.includes(x)&&!skip.includes(x));const r=rankList(pool,'alt').slice(0,6);if(!r.length)return'';
 return`<h3>Saran lain yang bisa dicoba sekarang</h3><p class="muted sm">Ketuk yang kamu lakukan. Yang sering kamu pilih akan naik ke depan.</p><div class="chips">${r.map(x=>`<button type="button" class="chip" data-a="altsug" data-n="${esc(x)}">${esc(x)}</button>`).join('')}</div>`}
A.altsug=el=>{const n=el.dataset.n;if(el.classList.contains('on'))return;el.classList.add('on');addStrat('aktivitas: '+n);recUse('alt',[n]);save();toast('Bagus, dicatat.')};
function renderMD(){const st=MD.steps[MD.i],c=AC(),n=MD.steps.length;let b='';
 if(st==='jeda')b=`<h2>Jeda sebentar</h2><p class="muted">Dorongan sering naik lalu mereda. Selama jeda kamu tidak perlu melakukan apa-apa.</p><div class="timer"><span id="mdt">${fmtMs(Math.max(0,S.settings.jeda_menit*60000-(Date.now()-MD.t0)))}</span></div><p id="mdmsg" class="muted c"></p>${S.settings.alasan?`<div class="card hl"><p class="muted sm">Alasanku</p><p style="font-size:1.1rem">${esc(S.settings.alasan)}</p></div>`:''}`;
 else if(st==='nama')b=`<h2>Beri nama dorongannya</h2><p class="muted">Amati saja, tanpa perintah "tahan" atau "turuti". Pilihan bagian tubuh tidak masuk riwayat maupun ekspor; hanya dipakai di perangkat ini untuk mengurutkan daftar.</p><h3>Seberapa kuat sekarang? (level 1–5)</h3>${slider('md_int',3,false,1,5,1)}<h3>Di mana terasa?</h3>${chips('md_body',OP('tubuh'),[],0,addChipUi)}`;
 else if(st==='ling')b=`<h2>Ubah lingkungan</h2><p class="muted">Pilih yang kamu lakukan.</p>${chips('md_ling',OP('ling'),MD.ling,0,addChipUi)}`;
 else if(st==='rencana'){const pl=S.plans.filter(p=>p.aktif!=='tidak');b=`<h2>Rencana jika-maka</h2>`+(pl.length?pl.map(p=>`<div class="card"><p><b>Jika</b> ${esc(p.jika)}</p><p><b>maka</b> ${esc(p.maka)}</p><div class="row"><button class="btn s" data-a="plando" data-id="${p.id}">Aku menjalankannya</button><button class="btn ghost s" data-a="plantrig" data-id="${p.id}">Pemicu muncul, belum</button></div></div>`).join(''):`<p class="muted">Belum ada rencana. Kamu bisa menyusunnya nanti di tab Rencana.</p>`)}
 else if(st==='alt'){const r=rankedAlts().slice(0,3);b=`<h2>Rencana respons</h2><p class="muted">Diurutkan dari yang paling cocok untuk situasimu.</p>`+(r.length?r.map(x=>`<div class="card"><p><b>${esc(x.a.nama)}</b></p>${(()=>{const cx=MD.ep?((S.episodes.find(e=>e.id===MD.ep)||{}).konteks||[]):[];return jikaOf(x.a)?`<p class="muted sm">Jika ${esc(jikaOf(x.a))}</p>`:cx.length?`<p class="muted sm">Jika ${esc(cx.join(', '))}</p>`:''})()}${x.rate>=0?`<p class="muted sm">Dari datamu: berhasil ${x.ok} dari ${x.n} percobaan (sampel kecil).</p>`:`<p class="muted sm">Baru sedikit dicoba, layak dicoba (eksplorasi).</p>`}<button class="btn s" data-a="altdo" data-id="${x.a.id}">Aku mencobanya</button></div>`).join(''):`<p class="muted">Belum ada aktivitas pilihanmu. Tambahkan di tab Rencana.</p>`)+altSug(r.map(x=>x.a.nama))}
 else if(st==='kontak')b=`<h2>Orang atau hal yang bisa kuhubungi</h2><div class="card"><p>${esc(S.settings.kontak_tepercaya)}</p></div><button class="btn s" data-a="contactdo">Aku menghubungi</button>`;
 else if(st==='tutup'){if(MD.ep)b=`<h2>Apa yang terjadi?</h2><p class="muted">Satu ketukan untuk menutup episode ini.</p><div class="chips"><button class="chip" data-a="mdres" data-r="lewat">Lewat</button><button class="chip" data-a="mdres" data-r="berkurang">Berkurang</button><button class="chip" data-a="mdres" data-r="diikuti">Diikuti</button></div><button class="btn ghost big" data-a="mdx">Nanti saja</button>`;
  else b=`<h2>Mau dicatat?</h2><p class="muted">Bantuan tadi tidak membuat catatan. Pilih hasilnya bila ingin dicatat.</p><div class="chips"><button class="chip" data-a="mdres" data-r="lewat">Catat: lewat</button><button class="chip" data-a="mdres" data-r="berkurang">Catat: berkurang</button><button class="chip" data-a="mdres" data-r="diikuti">Catat: diikuti</button></div><button class="btn ghost big" data-a="mdx">Tidak dicatat</button>`}
 const nav=st==='tutup'?'':`<div class="row"><button class="btn ghost" data-a="mdback" ${MD.i?'':'disabled style="opacity:.4"'}>Kembali</button><button class="btn" data-a="mdnext">Lanjut</button></div><button class="btn ghost big" data-a="mdjump">Aku sudah lewat / lanjut ke akhir</button>`;
 openFull(`<div class="top"><span class="muted">Mode Dorongan · ${MD.i+1}/${n}</span><button class="ib" data-a="mdx">Tutup</button></div>${b}${nav}`)}
function mdLeave(){const st=MD.steps[MD.i];
 if(st==='jeda'&&Date.now()-MD.t0>=120000)addStrat('jeda');
 if(st==='nama'){const v=sliderVal('md_int');if(v!==null&&MD.ep){const e=S.episodes.find(x=>x.id===MD.ep);if(e){if(e.intensitas_awal==='')e.intensitas_awal=v;e.intensitas_puncak=Math.max(Number(e.intensitas_puncak)||0,v);save()}}}
 if(st==='nama'){const bd=picked('md_body');if(bd.length&&!MD.bodyDone){recUse('tubuh',bd);MD.bodyDone=true;save()}}
 if(st==='ling'){const nl=picked('md_ling');recNew('ling',nl,MD.ling);MD.ling=nl;MD.ling.forEach(x=>addStrat(x.toLowerCase()));save()}}
A.mdnext=()=>{mdLeave();if(MD.i<MD.steps.length-1)MD.i++;renderMD()};
A.mdback=()=>{mdLeave();if(MD.i>0)MD.i--;renderMD()};
A.mdjump=()=>{mdLeave();MD.i=MD.steps.length-1;renderMD()};
A.mdx=()=>{mdLeave();if(MD.iv)clearInterval(MD.iv);MD=null;closeFull();render();toast('Bantuan ditutup. Hasil episode bisa ditutup dari beranda.')};
A.md=el=>openMD(el.dataset.ep||null);
A.plando=el=>{const p=S.plans.find(x=>x.id===el.dataset.id);p.kali_pemicu_muncul=(+p.kali_pemicu_muncul||0)+1;p.kali_dilaksanakan=(+p.kali_dilaksanakan||0)+1;save();addStrat('rencana jika-maka');toast('Tercatat.')};
A.plantrig=el=>{const p=S.plans.find(x=>x.id===el.dataset.id);p.kali_pemicu_muncul=(+p.kali_pemicu_muncul||0)+1;save();toast('Tercatat. Rencananya bisa ditinjau nanti.')};
A.altdo=el=>{const a=S.activities.find(x=>x.id===el.dataset.id);const pp=S.plans.find(q=>q.maka===a.nama);if(pp){pp.kali_pemicu_muncul=(+pp.kali_pemicu_muncul||0)+1;pp.kali_dilaksanakan=(+pp.kali_dilaksanakan||0)+1}S.activityLog.push({id:newId(S.activityLog),aktivitas_id:a.id,waktu:isoTz(),durasi_menit:'',episode_id:MD.ep||''});addStrat('aktivitas: '+a.nama);save();toast('Bagus, dicatat.')};
A.contactdo=()=>{addStrat('hubungi seseorang');toast('Dicatat.')};
A.mdres=el=>{const r=el.dataset.r;let epId=MD.ep,diikutiEv=null;
 if(!epId){const e=newEp(MD.started);e.strategi=[...MD.used];e.intensitas_awal='';S.episodes.push(e);epId=e.id;closeEpisode(epId,r,false)}else closeEpisode(epId,r,false);
 diikutiEv=S.events.find(v=>v.episode_id===epId);if(MD.iv)clearInterval(MD.iv);MD=null;closeFull();render();
 if(r==='diikuti'&&diikutiEv)openProtocol(diikutiEv.id);else{toast('Tercatat. Mau menulis satu hal yang kamu pelajari?',[{t:'Tulis',f:()=>openNote(epId)}])}};

/* ================= protokol pasca-kejadian ================= */
let PR=null;
function openProtocol(evId){PR={ev:evId,i:0};renderPR()}
function renderPR(){const v=S.events.find(x=>x.id===PR.ev);if(!v){closeFull();return}let b='';
 if(PR.i===0)b=`<h2>Terima kasih sudah mencatat</h2><p style="font-size:1.05rem">Kejadian ini adalah informasi, bukan penghapus progres. Yang penting adalah langkah berikutnya.</p><button class="btn big" data-a="prx">Selesai</button><button class="btn ghost big" data-a="prnext">Refleksi singkat (opsional)</button>`;
 else if(PR.i===1)b=`<h2>Refleksi singkat</h2><h3>Apa yang terjadi sebelumnya, dan apa yang kurasakan?</h3>${chips('p_k',konteksList(),v.konteks,5,addChipUi)}<h3>Apa yang kubutuhkan?</h3>${chips('p_n',OP('kebutuhan'),v.kebutuhan,0,addChipUi)}<label>Satu perubahan kecil yang akan kucoba (maks 120)</label><input type="text" id="p_ch" maxlength="120" placeholder="mis. ponsel diisi daya di luar kamar"><h3>Kapan aku kembali ke rencana?</h3>${chips('p_t',['sekarang','1 jam lagi','besok pagi'],[],1)}<button class="btn big" data-a="prnext">Lanjut</button>`;
 else b=`<h2>Satu aksi pemulihan</h2><p class="muted">Mis. minum air, keluar ruangan, atau tidur. Lalu, bila mau, satu baris yang kamu pelajari.</p>${chips('p_j',listFor('njenis'),[],1,addChipUi,'njenis')}<input type="text" id="p_n2" maxlength="140" placeholder="yang kupelajari (opsional)"><button class="btn big" data-a="prfin">Selesai</button>`;
 openFull(`<div class="top"><span class="muted">Setelah kejadian</span><button class="ib" data-a="prx">Tutup</button></div>${b}`)}
A.prnext=()=>{const v=S.events.find(x=>x.id===PR.ev);if(PR.i===1&&v){const k=picked('p_k'),n=picked('p_n');recNew('konteks',k,v.konteks);recNew('kebutuhan',n,v.kebutuhan);if(k.length)v.konteks=k;if(n.length)v.kebutuhan=n;const t=one('p_t');if(t==='sekarang')v.jam_kembali_ke_rencana=0;else if(t==='1 jam lagi')v.jam_kembali_ke_rencana=1;else if(t==='besok pagi'){const now=new Date(),x=new Date(now);x.setHours(7,0,0,0);if(x<=now)x.setDate(x.getDate()+1);v.jam_kembali_ke_rencana=Math.round((x-now)/3600000)}
 const ch=val('p_ch').trim();if(ch)S.notes.push({id:newId(S.notes),waktu:isoTz(),jenis:'hasil protokol',isi:ch,episode_id:v.episode_id||''});save()}
 PR.i++;renderPR()};
A.prfin=()=>{const j=one('p_j'),t=val('p_n2').trim();const v=S.events.find(x=>x.id===PR.ev);if(t||j){S.notes.push({id:newId(S.notes),waktu:isoTz(),jenis:j||'pemicu baru',isi:t,episode_id:v?v.episode_id:''});noteJenis(j);recUse('njenis',j?[j]:[]);save()}A.prx()};
A.prx=()=>{PR=null;closeFull();render();toast('Silakan lanjut. Datanya sudah tersimpan.')};
function openNote(epId){openSheet(`<h2>Yang kupelajari</h2>${chips('n_j',listFor('njenis'),[],1,addChipUi,'njenis')}<input type="text" id="n_t" maxlength="140" placeholder="satu baris (opsional)"><button class="btn big" data-a="notesave" data-ep="${epId||''}">Simpan</button>`)}
A.notesave=el=>{const t=val('n_t').trim();if(!t&&!one('n_j')){closeSheet(true);return}S.notes.push({id:newId(S.notes),waktu:isoTz(),jenis:one('n_j')||'pemicu baru',isi:t,episode_id:el.dataset.ep||''});noteJenis(one('n_j'));recUse('njenis',one('n_j')?[one('n_j')]:[]);save();closeSheet(true);render();toast('Tersimpan.')};
A.addnote=()=>openNote('');

/* ================= check-in ================= */
function openCheckin(d){const c=S.checkins.find(x=>x.tanggal===d)||{};
 openSheet(`<h2>Check-in ${esc(dayLabel(d))}</h2><p class="muted">10 pertanyaan singkat, sekitar 1 menit. Semua opsional.</p>`+CKQ.map((q,i)=>`<h3>${i+1}. ${q[1]}</h3>${q[2]?`<p class="muted sm" style="margin:0">${q[2]}</p>`:''}${chips('ck_'+q[0],q[3],[String((c[q[0]]==null||c[q[0]]==='')&&q[0]==='ada_kejadian'&&S.events.some(x=>dayOf(x.waktu)===d)?'ya':(c[q[0]]==null?'':c[q[0]]))],1)}`).join('')+`<button class="btn big" data-a="cksave" data-d="${d}">Simpan</button>`)}
A.ck=el=>openCheckin(el.dataset.d||today());
A.cksave=el=>{const d=el.dataset.d,row={tanggal:d};CKQ.forEach(q=>{const v=one('ck_'+q[0]);row[q[0]]=q[4]?(v?Number(v):''):(v==='lewati'?'':v)});if(S.events.some(x=>dayOf(x.waktu)===d))row.ada_kejadian='ya';row.waktu_isi=isoTz();row.dicatat_terlambat=d<today()?'ya':'tidak';
 const i=S.checkins.findIndex(x=>x.tanggal===d);if(i>=0)S.checkins[i]=row;else S.checkins.push(row);save();closeSheet(true);render();toast('Check-in tersimpan.')}

/* ================= statistik ================= */
function mk(w){const e7=addDays(w,6),L=S.episodes.filter(e=>{const d=dayOf(e.waktu_mulai);return d>=w&&d<=e7}),t=L.map(e=>+e.jumlah_tap_masih_kuat||0);return{tot:t.reduce((a,b)=>a+b,0),eps:t.filter(x=>x>0).length,n:L.length,max:Math.max(0,...t),rel:L.filter(e=>e.hasil==='diikuti').length}}
function wk(w){const ps=pausedSet(),ck=new Set(S.checkins.map(c=>c.tanggal)),td=today();const days=[0,1,2,3,4,5,6].map(i=>addDays(w,i)).filter(d=>d<=td);const e7=addDays(w,6);
 const ep=S.episodes.filter(e=>{const d=dayOf(e.waktu_mulai);return d>=w&&d<=e7}),ev=S.events.filter(e=>{const d=dayOf(e.waktu);return d>=w&&d<=e7});
 const jeda=days.filter(d=>ps.has(d)).length,rec=days.filter(d=>ck.has(d)).length,den=days.length-jeda;
 const cnt=r=>ep.filter(e=>e.hasil===r).length;
 return{w,ep:ep.length,ev:ev.length,lewat:cnt('lewat'),berkurang:cnt('berkurang'),diikuti:cnt('diikuti'),unk:ep.filter(e=>!e.hasil).length,med:med(ep.map(e=>e.durasi_menit)),rec,jeda,den,kel:den>0?Math.round(rec/den*100)/100:''}}
function allWeeks(){const ds=[...S.episodes.map(e=>dayOf(e.waktu_mulai)),...S.events.map(e=>dayOf(e.waktu)),...S.checkins.map(c=>c.tanggal)].sort();if(!ds.length)return[];let w=weekStart(ds[0]);const end=weekStart(today()),o=[];while(w<=end){o.push(w);w=addDays(w,7)}return o}
function baseline(){const c=AC();if(!c)return null;const s=c.mulai,e=addDays(s,13);if(today()<e)return null;const n=S.events.filter(v=>{const d=dayOf(v.waktu);return d>=s&&d<=e}).length;return n/2}
function bars(vals,labels,base,low){const W=320,H=110,mx=Math.max(1,...vals,base||0),bw=W/vals.length;let s=`<svg viewBox="0 0 ${W} ${H+16}" class="chart" role="img">`;
 vals.forEach((v,i)=>{const bh=(v/mx)*(H-16);s+=`<rect x="${i*bw+5}" y="${H-bh}" width="${bw-10}" height="${bh}" rx="3" class="${low[i]?'barlow':'bar'}"/><text x="${i*bw+bw/2}" y="${H-bh-3}" text-anchor="middle" class="bt">${v}</text><text x="${i*bw+bw/2}" y="${H+12}" text-anchor="middle" class="bl">${labels[i]}</text>`});
 if(base!=null){const y=H-(base/mx)*(H-16);s+=`<line x1="0" x2="${W}" y1="${y}" y2="${y}" class="bline"/>`}return s+'</svg>'}
function vPolaDasar(){const eps=S.episodes,n=eps.length;const ws=allWeeks().slice(-8);
 let h=`<h1>Pola</h1><p class="muted">Dari datamu sejauh ini. Ini informasi tentang pola kamu, bukan bukti bahwa sesuatu bekerja.</p>`;
 if(!n&&!S.events.length&&!S.checkins.length)return h+`<div class="card"><p>Belum ada data. Pola muncul setelah beberapa hari mencatat.</p></div>`;
 const W=ws.map(wk),td=today();const ps=pausedSet();
 const first=[...eps.map(e=>dayOf(e.waktu_mulai)),...S.checkins.map(c=>c.tanggal)].sort()[0]||td;let tot=0,ckd=0;const ck=new Set(S.checkins.map(c=>c.tanggal));for(let d=first;d<=td;d=addDays(d,1)){if(ps.has(d))continue;tot++;if(ck.has(d))ckd++}
 const closed=eps.filter(e=>e.hasil);
 h+=`<div class="card"><h3>Kelengkapan data</h3><p>Check-in: <b>${ckd}</b> dari <b>${tot}</b> hari${[...ps].length?' (hari jeda dikeluarkan)':''}.</p><p>Episode dorongan yang sudah ditutup: <b>${closed.length}</b> dari <b>${n}</b>.</p><p class="muted sm">Hari tanpa catatan bukan nol. Angka lain lebih bisa dipercaya bila kelengkapan tinggi.</p></div>`;
 const lbl=W.map(x=>x.w.slice(5)),low=W.map(x=>x.kel!==''&&x.kel<.5);
 const m4=a=>med(a.slice(-4));
 h+=`<div class="card"><h3>Dorongan per minggu</h3>${bars(W.map(x=>x.ep),lbl,null,low)}<p class="muted sm">Median 4 minggu terakhir: ${m4(W.map(x=>x.ep))??'–'}. Batang pudar = kelengkapan data di bawah 50%. Cooldown memengaruhi hitungan; dorongan yang tidak dicatat tidak terhitung (angka ini batas bawah).</p></div>`;
 const bs=baseline();
 h+=`<div class="card"><h3>Kejadian per minggu</h3>${bars(W.map(x=>x.ev),lbl,bs,low)}<p class="muted sm">Median 4 minggu terakhir: ${m4(W.map(x=>x.ev))??'–'}. ${bs!=null?'Garis putus-putus = baseline dua minggu pertama ('+r1(bs)+' per minggu). ':'Baseline tersedia setelah 2 minggu pertama. '}Sebagian penurunan bisa terjadi sendiri (regresi ke rata-rata), jadi jangan langsung dianggap hasil strategi.</p></div>`;

/* Statistik jika-maka dihitung dari episode nyata: "pemicu muncul" = episode yang konteksnya cocok dengan pemicu
   aktivitas (atau yang memakai aktivitas itu); "dijalankan" = di antaranya yang memakai aktivitas tersebut. */
function ifThenOne(a){const s='aktivitas: '+a.nama,P=a.pemicu||[];let m=0,d=0;S.episodes.forEach(e=>{const did=(e.strategi||[]).includes(s),hit=P.length&&(e.konteks||[]).some(x=>P.includes(x));if(did||hit){m++;if(did)d++}});return{m,d}}
function ifThen(){let m=0,d=0;S.activities.filter(a=>a.jenis==='alternatif').forEach(a=>{const t=ifThenOne(a);m+=t.m;d+=t.d});return{m,d}}

 h+=`<h2>Eksperimen pribadi</h2><p class="muted">Ubah satu hal selama beberapa hari, lalu bandingkan dengan periode yang sama panjang sebelumnya. Ini bukan bukti sebab-akibat.</p>`;
 const ex=S.experiments.find(x=>!x.selesai);
 if(ex){const end=addDays(ex.mulai,(ex.durasi||14)-1),ready=td>end;h+=`<div class="card hl"><p><b>${esc(ex.perubahan)}</b></p><p class="muted sm">Hipotesis: ${esc(ex.hipotesis)} · metrik: ${esc(ex.metrik)} · ${esc(ex.mulai)} s/d ${esc(end)}</p><button class="btn s" data-a="expfin" data-id="${ex.id}">${ready?'Lihat hasil':'Akhiri sekarang'}</button></div>`}

 return h}

function expCompare(x){const L=x.durasi||14,s1=x.mulai,e1=addDays(s1,L-1),s0=addDays(s1,-L),e0=addDays(s1,-1);const inr=(d,a,b)=>d>=a&&d<=b;
 const ps=pausedSet(),ck=new Set(S.checkins.map(c=>c.tanggal));const comp=(a,b)=>{let t=0,c=0;for(let d=a;d<=b;d=addDays(d,1)){if(ps.has(d))continue;t++;if(ck.has(d))c++}return t?Math.round(c/t*100):0};
 let a,b;if(x.metrik.startsWith('dorongan')){a=S.episodes.filter(e=>inr(dayOf(e.waktu_mulai),s0,e0)).length;b=S.episodes.filter(e=>inr(dayOf(e.waktu_mulai),s1,e1)).length}
 else if(x.metrik.startsWith('kejadian')){a=S.events.filter(e=>inr(dayOf(e.waktu),s0,e0)).length;b=S.events.filter(e=>inr(dayOf(e.waktu),s1,e1)).length}
 else{a=med(S.reviews.filter(r=>inr(r.minggu_mulai,addDays(s0,-6),e0)).map(r=>r.rating_kontrol));b=med(S.reviews.filter(r=>inr(r.minggu_mulai,addDays(s1,-6),e1)).map(r=>r.rating_kontrol))}
 return{a,b,ka:comp(s0,e0),kb:comp(s1,e1),L}}

function cyrb53(str,seed){seed=seed||0;let h1=0xdeadbeef^seed,h2=0x41c6ce57^seed;for(let i=0,ch;i<str.length;i++){ch=str.charCodeAt(i);h1=Math.imul(h1^ch,2654435761);h2=Math.imul(h2^ch,1597334677)}h1=Math.imul(h1^(h1>>>16),2246822507)^Math.imul(h2^(h2>>>13),3266489909);h2=Math.imul(h2^(h2>>>16),2246822507)^Math.imul(h1^(h1>>>13),3266489909);return 4294967296*(2097151&h2)+(h1>>>0)}
const hashPin=(p,s)=>{let x=s+p;for(let i=0;i<500;i++)x=String(cyrb53(x,i));return x};
function getPin(){try{return JSON.parse(localStorage.getItem(PINKEY))}catch(e){return null}}
const hasPin=()=>!!getPin();
function setPin(p){const salt=uid()+uid();try{localStorage.setItem(PINKEY,JSON.stringify({salt,h:hashPin(p,salt)}))}catch(e){}}
function showLock(){const l=$('#lock');l.innerHTML=`<h1>${esc(S.settings.nama_netral)}</h1><p class="muted">Masukkan PIN</p><input type="password" inputmode="numeric" id="pin_in" maxlength="8" autocomplete="off"><p id="pin_msg" class="muted sm"></p><button class="btn" data-a="unlock" style="margin-top:8px">Buka</button>`;l.classList.add('open');setTimeout(()=>{const i=$('#pin_in');if(i)i.focus()},50)}
A.unlock=()=>{const p=getPin(),v=$('#pin_in').value;if(p&&hashPin(v,p.salt)===p.h){$('#lock').classList.remove('open');$('#lock').innerHTML='';render()}else{$('#pin_msg').textContent='PIN tidak cocok.';$('#pin_in').value=''}};
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&$('#pin_in'))A.unlock()});

async function pwaCheck(manual){
 if(PWA.busy)return;
 if(!pwaWeb()){if(manual){PWA.msg='Cek pembaruan hanya jalan bila aplikasi dibuka lewat alamat web (https://…), bukan dari file di perangkat.';pwaRender()}return}
 if(navigator.onLine===false){if(manual){PWA.msg='Tidak ada koneksi internet. Coba lagi saat online.';pwaRender()}return}
 PWA.busy=true;if(manual){PWA.msg='Memeriksa…';pwaRender()}
 try{
  try{const reg=PWA.reg||await navigator.serviceWorker.getRegistration();if(reg)await reg.update()}catch(e){}
  const v=await pwaFetchLatest(),was=PWA.update;PWA.latest=v;PWA.checkedAt=Date.now();pwaFlag('chk',PWA.checkedAt);
  PWA.update=vcmp(v,APP_VERSION)>0;

  if(PWA.update&&!was&&!manual)toast('Versi '+v+' tersedia.',[{t:'Perbarui',f:()=>A.pwaapply()}]);
 }catch(e){if(manual)PWA.msg='Gagal memeriksa. Pastikan online, lalu coba lagi.'}

 <h3>Pemisah kolom (CSV)</h3>${chips('x_s',SEPS,[UI.expSep===';'?SEPS[1]:SEPS[0]],1)}<p class="muted sm">Bila di Excel semua isi menumpuk di satu kolom, ekspor ulang dengan pilihan pemisah yang lain. Impor aplikasi ini membaca keduanya.</p>`;

function dl(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.rel='noopener';a.style.display='none';document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},60000)}
function exportItems(fmt,sel,opt,zipName){const day=today();
 if(fmt==='xlsx'){const names=sel.map(x=>x.f.replace('.csv',''));const sheets=sel.map(sc=>({name:sc.f.replace('.csv',''),cols:sc.cols,rows:exRows(sc,opt)}));
 if(names.includes('statistik_mingguan')||names.includes('episode_dorongan'))sheets.push({name:'masih_kuat_mingguan',cols:C('minggu_mulai,jumlah_episode,total_tekan_masih_kuat,episode_dengan_masih_kuat,maks_tekan_satu_episode,episode_relapse'),rows:allWeeks().filter(w=>inRange(w,opt)).map(w=>{const x=mk(w);return{minggu_mulai:w,jumlah_episode:x.n,total_tekan_masih_kuat:x.tot,episode_dengan_masih_kuat:x.eps,maks_tekan_satu_episode:x.max,episode_relapse:x.rel}})});
  sheets.push({name:'manifest',cols:C('nama_sheet,jumlah_baris,versi_skema,diekspor_pada,zona_waktu'),rows:sheets.map(x=>({nama_sheet:x.name,jumlah_baris:x.rows.length,versi_skema:6,diekspor_pada:isoTz(),zona_waktu:tzName()}))});
  return{items:[{name:zipName+'-'+day+'.xlsx',blob:xlsxBlob(sheets),rows:sheets.slice(0,-1).reduce((a,x)=>a+x.rows.length,0)}]}}
 const files=buildExport(sel,{...opt,forceZip:fmt==='zip'});
 const zip={name:zipName+'-'+day+'.zip',blob:zipBlob(files)};
 if(fmt==='zip')return{items:[{...zip,rows:files.filter(f=>f.name!=='manifest.csv').reduce((a,f)=>a+f.rows,0)}],zip};
 return{items:files.map(f=>({name:f.name,blob:new Blob([f.data],{type:'text/csv'}),rows:f.rows})),zip}}
async function deliver(out,mode){
 const mk=x=>new File([x.blob],x.name,{type:mimeOf(x.name)});
 if(mode==='share'&&canShareFiles()){
  let files=out.items.map(mk);
  if(!navigator.canShare({files})&&out.zip)files=[mk(out.zip)];
  if(navigator.canShare({files})){try{await navigator.share({files});return 'shared'}catch(e){if(e&&e.name==='AbortError')return 'cancel'}}}
 const sv=out.items.length>1&&out.zip?[out.zip]:out.items;sv.forEach(x=>dl(x.blob,x.name));return 'saved'}
